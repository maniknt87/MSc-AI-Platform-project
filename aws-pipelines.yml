trigger:
- ai-platform-ui

pool:
  name: devops-lin-agent

variables:
  terraformWorkingDirectory: 'backend/terraform/aws'

steps:

- checkout: self
  displayName: 'Checkout repository'


# =========================================================
# Install Terraform
# =========================================================

- task: TerraformInstaller@1
  displayName: 'Install Terraform'
  inputs:
    terraformVersion: 'latest'


# =========================================================
# Terraform Init
# =========================================================

- task: AWSShellScript@1
  displayName: 'Terraform Init'
  inputs:
    awsCredentials: 'AWS-Terraform-Connection'
    regionName: 'ap-south-1'
    scriptType: 'inline'
    inlineScript: |
      set -e

      echo "======================================"
      echo "AWS Identity"
      echo "======================================"

      aws sts get-caller-identity

      echo "======================================"
      echo "Checking S3 Terraform State"
      echo "======================================"

      aws s3api head-object \
        --bucket mani-terraform-state-699754982224 \
        --key aws/terraform.tfstate \
        --region ap-south-1

      echo "======================================"
      echo "Terraform Init"
      echo "======================================"

      cd "$(terraformWorkingDirectory)"

      echo "Working directory:"
      pwd

      terraform version

      terraform init \
        -reconfigure \
        -input=false

      echo "======================================"
      echo "Terraform State"
      echo "======================================"

      terraform state list

      echo "======================================"
      echo "Terraform Init completed"
      echo "======================================"


# =========================================================
# Terraform Validate
# =========================================================

- task: AWSShellScript@1
  displayName: 'Terraform Validate'
  inputs:
    awsCredentials: 'AWS-Terraform-Connection'
    regionName: 'ap-south-1'
    scriptType: 'inline'
    inlineScript: |
      set -e

      cd "$(terraformWorkingDirectory)"

      echo "======================================"
      echo "Terraform Validate"
      echo "======================================"

      terraform validate

      echo "Terraform validation completed"


# =========================================================
# Terraform Plan
# =========================================================

- task: AWSShellScript@1
  displayName: 'Terraform Plan'
  inputs:
    awsCredentials: 'AWS-Terraform-Connection'
    regionName: 'ap-south-1'
    scriptType: 'inline'
    inlineScript: |
      set -e

      cd "$(terraformWorkingDirectory)"

      echo "======================================"
      echo "Terraform Plan"
      echo "======================================"

      terraform plan \
        -input=false \
        -out=tfplan

      echo "======================================"
      echo "Terraform Plan completed"
      echo "======================================"

      ls -lh tfplan