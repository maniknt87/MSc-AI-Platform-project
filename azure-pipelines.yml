trigger:
- ai-platform-ui

pool:
  name: devops-lin-agent

stages:

# ============================================================
# STAGE 1 - CI VALIDATION
# ============================================================

- stage: CI_Validation
  displayName: 'CI Validation'

  jobs:
  - job: CI_Checks
    displayName: 'Terraform CI Checks'

    steps:

    - checkout: self
      displayName: 'Checkout repository'

    - script: |
        set -e

        echo "======================================"
        echo "Terraform version"
        echo "======================================"

        terraform version

      displayName: 'Check Terraform installation'


    - script: |
        set -e

        echo "======================================"
        echo "Terraform format check"
        echo "======================================"

        terraform fmt -check -recursive backend/terraform

        echo "======================================"
        echo "Terraform format check completed"
        echo "======================================"

      displayName: 'Terraform format check'


# ============================================================
# STAGE 2 - AWS VALIDATION
# ============================================================

- stage: AWS_Validation
  displayName: 'AWS Terraform Validation'

  dependsOn: CI_Validation
  condition: succeeded()

  jobs:
  - job: Validate_AWS
    displayName: 'Validate AWS Terraform'

    steps:

    - checkout: self
      displayName: 'Checkout repository'

    - script: |
        set -e

        echo "======================================"
        echo "Validating AWS Terraform configuration"
        echo "======================================"

        terraform -chdir=backend/terraform/aws init \
          -backend=false \
          -input=false

        terraform -chdir=backend/terraform/aws validate

        echo "======================================"
        echo "AWS Terraform validation completed"
        echo "======================================"

      displayName: 'Validate AWS Terraform'


# ============================================================
# STAGE 3 - AZURE VALIDATION
# ============================================================

- stage: Azure_Validation
  displayName: 'Azure Terraform Validation'

  dependsOn: AWS_Validation
  condition: succeeded()

  jobs:
  - job: Validate_Azure
    displayName: 'Validate Azure Terraform'

    steps:

    - checkout: self
      displayName: 'Checkout repository'

    - script: |
        set -e

        echo "======================================"
        echo "Validating Azure Terraform configuration"
        echo "======================================"

        terraform -chdir=backend/terraform/azure init \
          -backend=false \
          -input=false

        terraform -chdir=backend/terraform/azure validate

        echo "======================================"
        echo "Azure Terraform validation completed"
        echo "======================================"

      displayName: 'Validate Azure Terraform'


# ============================================================
# STAGE 4 - TERRAFORM STATE BOOTSTRAP
# ============================================================

- stage: Terraform_State_Bootstrap
  displayName: 'Terraform State Bootstrap'

  dependsOn: Azure_Validation
  condition: succeeded()

  jobs:
  - job: Bootstrap_State
    displayName: 'Create Terraform Remote State'

    steps:

    - checkout: self
      displayName: 'Checkout repository'

    - task: AzureCLI@2
      displayName: 'Create Terraform State Storage'

      inputs:
        azureSubscription: 'Azure-Terraform-Free-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo "======================================"
          echo "Terraform State Bootstrap"
          echo "======================================"

          RESOURCE_GROUP="rg-terraform-state"
          CONTAINER_NAME="tfstate"
          LOCATION="centralindia"

          echo "Getting Azure subscription information..."

          SUBSCRIPTION_ID=$(az account show \
            --query id \
            --output tsv)

          SUBSCRIPTION_NAME=$(az account show \
            --query name \
            --output tsv)

          echo "Subscription:"
          echo "$SUBSCRIPTION_NAME"

          echo "Subscription ID:"
          echo "$SUBSCRIPTION_ID"

          SUBSCRIPTION_SUFFIX=$(echo "$SUBSCRIPTION_ID" \
            | tr -d '-' \
            | cut -c1-8)

          STORAGE_ACCOUNT="tfstateai${SUBSCRIPTION_SUFFIX}"

          echo "Terraform state storage account:"
          echo "$STORAGE_ACCOUNT"


          echo "======================================"
          echo "Checking Resource Group"
          echo "======================================"

          if az group show \
            --name "$RESOURCE_GROUP" \
            --output none 2>/dev/null
          then
            echo "Resource group already exists."
          else
            echo "Creating resource group..."

            az group create \
              --name "$RESOURCE_GROUP" \
              --location "$LOCATION"

            echo "Resource group created."
          fi


          echo "======================================"
          echo "Checking Storage Account"
          echo "======================================"

          if az storage account show \
            --name "$STORAGE_ACCOUNT" \
            --resource-group "$RESOURCE_GROUP" \
            --output none 2>/dev/null
          then
            echo "Storage account already exists."
          else
            echo "Creating storage account..."

            az storage account create \
              --name "$STORAGE_ACCOUNT" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --sku Standard_LRS \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false

            echo "Storage account created."
          fi


          echo "======================================"
          echo "Checking Terraform State Container"
          echo "======================================"

          STORAGE_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --query "[0].value" \
            --output tsv)

          if az storage container show \
            --name "$CONTAINER_NAME" \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$STORAGE_KEY" \
            --output none 2>/dev/null
          then
            echo "Terraform state container already exists."
          else
            echo "Creating Terraform state container..."

            az storage container create \
              --name "$CONTAINER_NAME" \
              --account-name "$STORAGE_ACCOUNT" \
              --account-key "$STORAGE_KEY" \
              --public-access off

            echo "Terraform state container created."
          fi


          echo "======================================"
          echo "Terraform State Bootstrap Complete"
          echo "======================================"

# ============================================================
# TEMPORARY CLEANUP - TERRAFORM DESTROY
# ============================================================

- stage: Azure_Terraform_Destroy
  displayName: 'TEMP - Azure Terraform Destroy'

  dependsOn: Terraform_State_Bootstrap
  condition: succeeded()

  jobs:
  - job: Terraform_Destroy
    displayName: 'Destroy Azure Terraform Infrastructure'

    steps:

    - checkout: self
      displayName: 'Checkout repository'


    - task: AzureCLI@2
      displayName: 'Terraform Destroy - Free Azure Subscription'

      inputs:
        azureSubscription: 'Azure-Terraform-Free-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo "======================================"
          echo "WARNING - TERRAFORM DESTROY"
          echo "======================================"

          az account show \
            --query "{SubscriptionId:id, SubscriptionName:name, TenantId:tenantId}" \
            --output table


          echo "======================================"
          echo "Terraform backend configuration"
          echo "======================================"

          RESOURCE_GROUP="rg-terraform-state"
          CONTAINER_NAME="tfstate"
          STATE_KEY="azure-development.tfstate"

          SUBSCRIPTION_ID=$(az account show \
            --query id \
            --output tsv)

          SUBSCRIPTION_SUFFIX=$(echo "$SUBSCRIPTION_ID" \
            | tr -d '-' \
            | cut -c1-8)

          STORAGE_ACCOUNT="tfstateai${SUBSCRIPTION_SUFFIX}"


          echo "Resource Group:"
          echo "$RESOURCE_GROUP"

          echo "Storage Account:"
          echo "$STORAGE_ACCOUNT"

          echo "Container:"
          echo "$CONTAINER_NAME"

          echo "State Key:"
          echo "$STATE_KEY"


          echo "======================================"
          echo "Getting storage account access key"
          echo "======================================"

          export ARM_ACCESS_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --query "[0].value" \
            --output tsv)


          if [ -z "$ARM_ACCESS_KEY" ]; then
            echo "ERROR: Unable to obtain storage account access key."
            exit 1
          fi


          echo "======================================"
          echo "Terraform initialization"
          echo "======================================"

          terraform -chdir=backend/terraform/azure init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${STORAGE_ACCOUNT}" \
            -backend-config="container_name=${CONTAINER_NAME}" \
            -backend-config="key=${STATE_KEY}"


          echo "======================================"
          echo "Terraform state"
          echo "======================================"

          terraform -chdir=backend/terraform/azure state list


          echo "======================================"
          echo "TERRAFORM DESTROY STARTING"
          echo "======================================"

          terraform -chdir=backend/terraform/azure destroy \
            -input=false \
            -auto-approve


          echo "======================================"
          echo "Terraform Destroy completed"
          echo "======================================"
# ============================================================
# STAGE 5 - AZURE TERRAFORM PLAN
# ============================================================

- stage: Azure_Terraform_Plan
  displayName: 'Azure Terraform Plan - Free Subscription'

  dependsOn: Terraform_State_Bootstrap
  condition: succeeded()

  jobs:
  - job: Terraform_Plan
    displayName: 'Terraform Plan - Free Azure Subscription'

    steps:

    - checkout: self
      displayName: 'Checkout repository'

    - task: AzureCLI@2
      displayName: 'Terraform Plan - Free Azure Subscription'

      inputs:
        azureSubscription: 'Azure-Terraform-Free-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo "======================================"
          echo "Azure account information"
          echo "======================================"

          az account show \
            --query "{SubscriptionId:id, SubscriptionName:name, TenantId:tenantId}" \
            --output table


          echo "======================================"
          echo "Terraform backend configuration"
          echo "======================================"

          RESOURCE_GROUP="rg-terraform-state"
          CONTAINER_NAME="tfstate"
          STATE_KEY="azure-development.tfstate"

          SUBSCRIPTION_ID=$(az account show \
            --query id \
            --output tsv)

          SUBSCRIPTION_SUFFIX=$(echo "$SUBSCRIPTION_ID" \
            | tr -d '-' \
            | cut -c1-8)

          STORAGE_ACCOUNT="tfstateai${SUBSCRIPTION_SUFFIX}"

          echo "Resource Group:"
          echo "$RESOURCE_GROUP"

          echo "Storage Account:"
          echo "$STORAGE_ACCOUNT"

          echo "Container:"
          echo "$CONTAINER_NAME"

          echo "State Key:"
          echo "$STATE_KEY"


          echo "======================================"
          echo "Getting storage account access key"
          echo "======================================"

          export ARM_ACCESS_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --query "[0].value" \
            --output tsv)

          if [ -z "$ARM_ACCESS_KEY" ]; then
            echo "ERROR: Unable to obtain storage account access key."
            exit 1
          fi

          echo "Storage backend authentication obtained."


          echo "======================================"
          echo "Terraform initialization"
          echo "======================================"

          terraform -chdir=backend/terraform/azure init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${STORAGE_ACCOUNT}" \
            -backend-config="container_name=${CONTAINER_NAME}" \
            -backend-config="key=${STATE_KEY}"


          echo "======================================"
          echo "Terraform Plan"
          echo "======================================"

          terraform -chdir=backend/terraform/azure plan \
            -input=false \
            -out=tfplan


          echo "======================================"
          echo "Terraform plan generated"
          echo "======================================"

          ls -lh backend/terraform/azure/tfplan


    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'

      inputs:
        targetPath: 'backend/terraform/azure/tfplan'
        artifact: 'azure-terraform-plan'
        publishLocation: 'pipeline'


# ============================================================
# STAGE 6 - AZURE TERRAFORM APPLY
# ============================================================

- stage: Azure_Terraform_Apply
  displayName: 'Azure Terraform Apply - Free Subscription'

  dependsOn: Azure_Terraform_Plan
  condition: succeeded()

  jobs:
  - job: Terraform_Apply
    displayName: 'Apply Terraform Plan'

    steps:

    - checkout: self
      displayName: 'Checkout repository'


    - task: DownloadPipelineArtifact@2
      displayName: 'Download Terraform Plan'

      inputs:
        buildType: 'current'
        artifactName: 'azure-terraform-plan'
        targetPath: '$(Pipeline.Workspace)/azure-terraform-plan'


    - task: AzureCLI@2
      displayName: 'Terraform Apply - Free Azure Subscription'

      inputs:
        azureSubscription: 'Azure-Terraform-Free-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo "======================================"
          echo "Azure account information"
          echo "======================================"

          az account show \
            --query "{SubscriptionId:id, SubscriptionName:name, TenantId:tenantId}" \
            --output table


          echo "======================================"
          echo "Terraform backend configuration"
          echo "======================================"

          RESOURCE_GROUP="rg-terraform-state"
          CONTAINER_NAME="tfstate"
          STATE_KEY="azure-development.tfstate"

          SUBSCRIPTION_ID=$(az account show \
            --query id \
            --output tsv)

          SUBSCRIPTION_SUFFIX=$(echo "$SUBSCRIPTION_ID" \
            | tr -d '-' \
            | cut -c1-8)

          STORAGE_ACCOUNT="tfstateai${SUBSCRIPTION_SUFFIX}"

          echo "Resource Group:"
          echo "$RESOURCE_GROUP"

          echo "Storage Account:"
          echo "$STORAGE_ACCOUNT"

          echo "Container:"
          echo "$CONTAINER_NAME"

          echo "State Key:"
          echo "$STATE_KEY"


          echo "======================================"
          echo "Getting storage account access key"
          echo "======================================"

          export ARM_ACCESS_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --query "[0].value" \
            --output tsv)

          if [ -z "$ARM_ACCESS_KEY" ]; then
            echo "ERROR: Unable to obtain storage account access key."
            exit 1
          fi


          echo "======================================"
          echo "Terraform initialization"
          echo "======================================"

          terraform -chdir=backend/terraform/azure init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${STORAGE_ACCOUNT}" \
            -backend-config="container_name=${CONTAINER_NAME}" \
            -backend-config="key=${STATE_KEY}"


          echo "======================================"
          echo "Checking Terraform plan artifact"
          echo "======================================"

          PLAN_SOURCE="$(Pipeline.Workspace)/azure-terraform-plan/tfplan"

          if [ ! -f "$PLAN_SOURCE" ]; then
            echo "ERROR: Terraform plan artifact not found."
            exit 1
          fi

          echo "Terraform plan found:"
          ls -lh "$PLAN_SOURCE"


          echo "======================================"
          echo "Copying Terraform plan"
          echo "======================================"

          cp "$PLAN_SOURCE" \
            backend/terraform/azure/tfplan


          echo "======================================"
          echo "APPLYING TERRAFORM PLAN"
          echo "======================================"

          terraform -chdir=backend/terraform/azure apply \
            -input=false \
            tfplan


          echo "======================================"
          echo "Terraform Apply completed successfully"
          echo "======================================"